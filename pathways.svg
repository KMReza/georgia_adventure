       stroke-linecap="round" stroke-linejoin="round"/>

  <!-- soft clearing under the spawn point -->
  <ellipse cx="230" cy="280" rx="40" ry="30" fill="#f3ddb0"/>
  <ellipse cx="230" cy="280" rx="40" ry="30" fill="none" stroke="#d9b877" stroke-width="6"/>

  <!-- small clearings at each destination -->
  <circle cx="97" cy="168" r="22" fill="#f3ddb0"/>
  <circle cx="117" cy="298" r="20" fill="#f3ddb0"/>
  <circle cx="215" cy="100" r="22" fill="#f3ddb0"/>
  <circle cx="385" cy="120" r="22" fill="#f3ddb0"/>
  <circle cx="575" cy="140" r="22" fill="#f3ddb0"/>
  <circle cx="385" cy="390" r="22" fill="#f3ddb0"/>
  <circle cx="455" cy="285" r="24" fill="#f3ddb0"/>

</svg>