<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <g id="edgeLayer">
      <path d="M230,280 Q150,200 97,168" />
      <path d="M230,280 Q170,300 117,298" />
      <path d="M230,280 Q220,180 215,100" />
      <path d="M230,280 Q320,180 385,120" />
      <path d="M230,280 Q420,175 575,140" />
      <path d="M230,280 Q310,340 385,390" />
      <path d="M230,280 Q350,290 455,285" />
    </g>
  </defs>

  <!-- path shadow/edge -->
  <use href="#edgeLayer" fill="none" stroke="#d9b877" stroke-width="24"
